<!DOCTYPE html>
<html>
<head>
    <title>ثبت نام</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; direction: rtl; }
        .container { max-width: 400px; margin: auto; border: 1px solid #ddd; padding: 30px; border-radius: 10px; }
        input { margin: 10px; padding: 8px; width: 90%; }
        button { padding: 10px 30px; background: green; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .error { color: red; }
        .success { color: green; }
        a { color: blue; text-decoration: none; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-left: 15px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="{% url 'App:home' %}">صفحه اصلی</a>
        <a href="{% url 'App:product_list' %}">محصولات</a>
        <a href="{% url 'App:login' %}">ورود</a>
        <a href="{% url 'App:signup' %}">ثبت نام</a>
    </div>

    <div class="container">
        <h2>ثبت نام در سایت</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="نام کاربری" required><br>
            <input type="email" name="email" placeholder="ایمیل (اختیاری)"><br>
            <input type="password" name="password1" placeholder="رمز عبور" required><br>
            <input type="password" name="password2" placeholder="تکرار رمز عبور" required><br>
            <button type="submit">ثبت نام</button>
        </form>

        <p>قبلاً ثبت نام کرده‌اید؟ <a href="{% url 'App:login' %}">وارد شوید</a></p>
    </div>
</body>
</html>
