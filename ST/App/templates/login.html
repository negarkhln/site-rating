<!doctype html>
<html>
  <head>
    <title>ورود به سایت</title>
    <style>
      body {
        font-family: Arial;
        text-align: center;
        padding: 50px;
        direction: rtl;
      }

      .container {
        max-width: 400px;
        margin: auto;
        border: 1px solid #ddd;
        padding: 30px;
        border-radius: 10px;
      }

      input {
        margin: 10px;
        padding: 8px;
        width: 90%;
      }

      button {
        padding: 10px 30px;
        background: blue;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .error {
        color: red;
      }

      a {
        color: blue;
        text-decoration: none;
      }

      .nav {
        margin-bottom: 20px;
      }

      .nav a {
        margin-left: 15px;
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <a href="{% url 'App:home' %}">صفحه اصلی</a>
      <a href="{% url 'App:product_list' %}">محصولات</a>
      <a href="{% url 'App:login' %}">ورود</a>
      <a href="{% url 'App:signup' %}">ثبت نام</a>
      <p style="margin-top: 15px">
        <a href="{% url 'App:forgot_password' %}"
          >رمز عبور خود را فراموش کرده‌اید؟</a
        >
      </p>
    </div>

    <div class="container">
      <h2>ورود به سایت</h2>

      {% if messages %} {% for message in messages %}
      <p class="error">{{ message }}</p>
      {% endfor %} {% endif %}

      <form method="post">
        {% csrf_token %}
        <input
          type="text"
          name="username"
          placeholder="نام کاربری"
          required
        /><br />
        <input
          type="password"
          name="password"
          placeholder="رمز عبور"
          required
        /><br />
        <button type="submit">ورود</button>
      </form>

      <p>
        حساب کاربری ندارید؟ <a href="{% url 'App:signup' %}">ثبت نام کنید</a>
      </p>
    </div>
  </body>
</html>
