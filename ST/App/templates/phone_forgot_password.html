<!DOCTYPE html>
<html>
<head>
    <title>بازیابی رمز عبور</title>
    <style>
        body { font-family: Arial; padding: 50px; direction: rtl; text-align: center; }
        .container { max-width: 400px; margin: auto; border: 1px solid #ddd; padding: 30px; border-radius: 10px; }
        input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { background: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h2>بازیابی رمز عبور</h2>
        <p>شماره تلفن یا نام کاربری خود را وارد کنید.</p>

        {% if messages %}
            {% for message in messages %}
                <p class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">دریافت لینک بازیابی</button>
        </form>

        <p style="margin-top: 20px;">
            <a href="{% url 'App:login' %}">بازگشت به صفحه ورود</a>
        </p>
    </div>
</body>
</html>
